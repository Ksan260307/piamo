<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
  <meta name="description" content="こども むけの ピアノ アプリ。じゆうに ひいたり、おてほんを まねっこ したり。あそんだ日は どうぶつの スタンプが もらえます。スマホ・iPad でも あそべます。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ぴあも">
  <meta property="og:title" content="ぴあも — Piamo">
  <meta property="og:description" content="こども むけの ピアノ アプリ。まねっこ モードと、365 この どうぶつスタンプ。">
  <meta property="og:image" content="icon.png">
  <meta name="theme-color" content="#ffe9f0">
  <title>ぴあも — Piamo</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #fff7ec;
      overscroll-behavior: none;
      font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #unity-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      display: block; background: #fff7ec; outline: none; touch-action: none;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(180deg, #a6dcfa 0%, #fff7ec 75%);
      color: #5a3b2e; transition: opacity .7s ease; z-index: 2;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading img { width: min(560px, 80vw); height: auto; animation: bob 1.8s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
    #keys { display: flex; gap: 6px; }
    #keys span { width: 34px; height: 64px; border-radius: 0 0 12px 12px; background: #fff; border: 4px solid #f3d9c6; animation: press 1.4s ease-in-out infinite; }
    #keys span:nth-child(1) { animation-delay: 0s; } #keys span:nth-child(2) { animation-delay: .12s; }
    #keys span:nth-child(3) { animation-delay: .24s; } #keys span:nth-child(4) { animation-delay: .36s; }
    #keys span:nth-child(5) { animation-delay: .48s; } #keys span:nth-child(6) { animation-delay: .6s; }
    #keys span:nth-child(7) { animation-delay: .72s; } #keys span:nth-child(8) { animation-delay: .84s; }
    @keyframes press { 0%,70%,100% { transform: translateY(0); background: #fff; } 35% { transform: translateY(8px); background: #ffd6e2; } }
    #bar { width: min(420px, 70vw); height: 14px; border-radius: 8px; background: rgba(255,255,255,.8); overflow: hidden; border: 3px solid #fff; }
    #fill { width: 0%; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #ff9fbe, #ffd45e); transition: width .2s; }
    #tip { font-size: 16px; font-weight: 700; color: #7a5644; min-height: 1.4em; text-align: center; padding: 0 20px; }
    #pct { margin-top: -12px; font-size: 14px; color: #a07c68; letter-spacing: .1em; font-weight: 700; }
    #error button { margin-left: 12px; padding: 6px 14px; border-radius: 14px; border: 2px solid #e8a0b8; background: #ffd6e2; color: #5a3b2e; font-weight: 700; cursor: pointer; }
    #error { display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #fff; color: #6a3a2a; padding: 12px 20px; border-radius: 16px; font-size: 14px; z-index: 3; max-width: 80vw; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <img src="logo.png" alt="ぴあも">
    <div id="keys"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
    <div id="tip">けんばんを 10かい おすと、きょうの スタンプが もらえるよ</div>
  </div>
  <div id="error"></div>
  <noscript><p style="text-align:center;margin-top:40vh">この アプリで あそぶには JavaScript を ゆうこうに してください。</p></noscript>
  <script>
    const tips = [
      "けんばんを 10かい おすと、きょうの スタンプが もらえるよ",
      "5こめ・10こめ… は でっかい スタンプ！",
      "「まねっこ」で、おてほんと おなじ ように ひいてみよう",
      "まよったら、こたえの けんばんが ひかるよ",
      "「せってい」で、けんばんの かずや おとを かえられるよ",
      "ゆびで すーっと なぞると、つづけて なるよ",
    ];
    let tipIndex = 0;
    const tipEl = document.getElementById("tip");
    const tipTimer = setInterval(() => { tipIndex = (tipIndex + 1) % tips.length; tipEl.textContent = tips[tipIndex]; }, 3500);

    const canvas = document.getElementById("unity-canvas");
    const fill = document.getElementById("fill");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const pct = document.getElementById("pct");

    function unityShowBanner(msg, type) {
      if (type === "error") showError(msg);
      else console.log(msg);
    }

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
      const retry = document.createElement("button");
      retry.textContent = "もういちど よみこむ";
      retry.onclick = () => location.reload();
      errorBox.appendChild(retry);
    }

    if (!document.createElement("canvas").getContext("webgl2")) {
      showError("この ブラウザでは あそべません（WebGL 2.0 が ひつようです）。あたらしい Chrome / Edge / Safari / Firefox で ひらいてください。");
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/WebGLBuild.loader.js";
    const config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGLBuild.data.unityweb",
      frameworkUrl: buildUrl + "/WebGLBuild.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGLBuild.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ksan",
      productName: "Piamo",
      productVersion: "1.0.0",
      showBanner: unityShowBanner,
      autoSyncPersistentDataPath: true,
    };

    // 文字と鍵盤がくっきり見えるように、高精細な画面でも 2 倍までにする（重くなりすぎないように）
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

    // iOS のピンチ・ダブルタップ拡大や、スクロールでページが動かないようにする（鍵盤を すばやく れんだ できるように）
    const stop = (e) => e.preventDefault();
    document.addEventListener("gesturestart", stop, { passive: false });
    document.addEventListener("gesturechange", stop, { passive: false });
    document.addEventListener("dblclick", stop, { passive: false });
    document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || e.target === canvas) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchEnd < 320) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        fill.style.width = (progress * 100) + "%";
        pct.textContent = Math.round(progress * 100) + "%";
      }).then(() => {
        clearInterval(tipTimer);
        loading.classList.add("done");
        setTimeout(() => loading.remove(), 800);
        canvas.focus();
      }).catch((message) => {
        showError("よみこみに しっぱいしました: " + message);
      });
    };
    document.body.appendChild(script);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("pointerdown", () => canvas.focus());
  </script>
</body>
</html>
